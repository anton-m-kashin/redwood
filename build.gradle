buildscript {
  dependencies {
    classpath libs.kotlin.composePlugin
    classpath libs.kotlin.serializationPlugin
    classpath libs.buildConfigPlugin
    classpath libs.burst.gradle.plugin
    classpath libs.zipline.gradlePlugin
    classpath libs.paparazzi.gradlePlugin
    classpath libs.poko.gradlePlugin
    classpath libs.jetbrains.compose.gradlePlugin
    classpath 'app.cash.redwood.build:gradle-plugin'
    classpath 'app.cash.redwood:redwood-gradle-plugin'
  }
  repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
  }
}

apply plugin: 'org.jetbrains.dokka'

allprojects {
  configurations.configureEach { configuration ->
    def cfgName = configuration.name
    def isWasmWasi = cfgName.contains('wasmWasi')

    configuration.resolutionStrategy.dependencySubstitution {
      if (isWasmWasi) {
        // Wasm-Wasi configurations still resolve the KMP root modules so that common
        // source-set visibility inference sees the same module in every platform
        // compilation. The root .module files contain a wasmWasiApiElements-published
        // variant that delivers the physical fork klib.
        substitute module('androidx.compose.runtime:runtime') using module('clive.androidx.compose.runtime:runtime:1.12.0-dev01')
        substitute module('org.jetbrains.compose.runtime:runtime') using module('clive.androidx.compose.runtime:runtime:1.12.0-dev01')

        substitute module('androidx.compose.runtime:runtime-annotation') using module('clive.androidx.compose.runtime:runtime-annotation:1.12.0-dev01')
        substitute module('org.jetbrains.compose.runtime:runtime-annotation') using module('clive.androidx.compose.runtime:runtime-annotation:1.12.0-dev01')

        substitute module('androidx.compose.runtime:runtime-saveable') using module('clive.androidx.compose.runtime:runtime-saveable:1.12.0-dev01')
        substitute module('org.jetbrains.compose.runtime:runtime-saveable') using module('clive.androidx.compose.runtime:runtime-saveable:1.12.0-dev01')

        substitute module('androidx.collection:collection') using module('clive.androidx.collection:collection:1.12.0-dev01')
        substitute module('org.jetbrains.androidx.collection:collection') using module('clive.androidx.collection:collection:1.12.0-dev01')

        substitute module('androidx.annotation:annotation') using module('clive.androidx.annotation:annotation:1.12.0-dev01')
        substitute module('org.jetbrains.androidx.annotation:annotation') using module('clive.androidx.annotation:annotation:1.12.0-dev01')
      } else {
        // All other configurations resolve the clive KMP root modules, which
        // carry real androidx.compose.runtime common metadata while redirecting
        // non-wasm platforms back to the upstream AndroidX artifacts and pointing
        // wasm-wasi to the fork leaf. This makes common metadata compilation in
        // modules that depend on Compose runtime succeed.
        substitute module('androidx.compose.runtime:runtime') using module('clive.androidx.compose.runtime:runtime:1.12.0-dev01')
        substitute module('org.jetbrains.compose.runtime:runtime') using module('clive.androidx.compose.runtime:runtime:1.12.0-dev01')

        substitute module('androidx.compose.runtime:runtime-annotation') using module('clive.androidx.compose.runtime:runtime-annotation:1.12.0-dev01')
        substitute module('org.jetbrains.compose.runtime:runtime-annotation') using module('clive.androidx.compose.runtime:runtime-annotation:1.12.0-dev01')

        substitute module('androidx.compose.runtime:runtime-saveable') using module('clive.androidx.compose.runtime:runtime-saveable:1.12.0-dev01')
        substitute module('org.jetbrains.compose.runtime:runtime-saveable') using module('clive.androidx.compose.runtime:runtime-saveable:1.12.0-dev01')

        substitute module('androidx.collection:collection') using module('clive.androidx.collection:collection:1.12.0-dev01')
        substitute module('org.jetbrains.androidx.collection:collection') using module('clive.androidx.collection:collection:1.12.0-dev01')

        substitute module('androidx.annotation:annotation') using module('clive.androidx.annotation:annotation:1.12.0-dev01')
        substitute module('org.jetbrains.androidx.annotation:annotation') using module('clive.androidx.annotation:annotation:1.12.0-dev01')
      }
    }

  }
}

afterEvaluate {
  spotless {
    kotlin {
      targetExclude(
        // Apache 2-licensed files from AOSP.
        "build-support/src/main/resources/app/cash/redwood/buildsupport/composeHelpers.kt",
      )
    }
  }
}
